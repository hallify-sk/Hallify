<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@1,900&display=swap" rel="stylesheet" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>try{var __t=localStorage.getItem('hallify-theme');if(!__t){__t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'slate';}document.documentElement.setAttribute('data-theme',__t);}catch(e){}</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
