<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<!-- favicon.png never existed, so this 404'd on every page. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Poppins is self-hosted (see app.css). It used to load from Google's CDN,
		     which (a) the Content-Security-Policy now blocks and (b) sends every
		     visitor's IP to Google — at odds with the privacy policy's "no third-party
		     tracking", and a live GDPR issue for an EU service. -->
		<!-- Inter is the UI typeface on every page; preload it so first paint is not
		     a flash of Segoe UI / SF. Poppins is only the wordmark, so it can wait. -->
		<link rel="preload" href="%sveltekit.assets%/fonts/inter-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>try{var __t=localStorage.getItem('hallify-theme');if(!__t){__t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'slate';}document.documentElement.setAttribute('data-theme',__t);}catch(e){}</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
