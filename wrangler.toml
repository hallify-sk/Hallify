# Secrets must be set via wrangler (Worker secrets, NOT pages secrets):
#   Prod:  wrangler secret put SECRET_NAME
#   Dev:   wrangler secret put SECRET_NAME --env dev
# Required: STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY,
# STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_STARTER, STRIPE_PRICE_PROFESSIONAL,
# BREVO_API_KEY, CF_ZONE_ID, CF_API_TOKEN
# CRON_SECRET: required for the hourly clean-up. The Cron Trigger below calls
#   POST /api/cron/cleanup with it; without it that route is disabled and the scheduled
#   run only logs an error. Set it on BOTH workers at deploy:
#     wrangler secret put CRON_SECRET  and  wrangler secret put CRON_SECRET --env dev
# NOTE: SESSION_SECRET is NOT used — session ids are random UUIDs stored in D1 and
# are never signed. It was listed here and set as a prod secret, implying protection
# the code does not implement. Remove it with: wrangler secret delete SESSION_SECRET
# (EMAIL_FROM / EMAIL_FROM_NAME are non-secret [vars] below.)
#
# Deploy:
#   Dev  (dev.hallify.sk):  npm run deploy:dev
#   Prod (hallify.sk):      npm run deploy:prod

name = "hallify"
# worker.js wraps SvelteKit's generated .svelte-kit/cloudflare/_worker.js (fetch and
# static assets unchanged) and adds the scheduled() handler for the Cron Trigger.
# Inherited by [env.dev].
main = "worker.js"
# Set explicitly: without it, any login with access to more than one account makes
# every non-interactive wrangler command fail with "More than one account available".
account_id = "46d0e242dd6f2bba5cc3de0a393b8eb6"
compatibility_date = "2026-06-13"
compatibility_flags = ["nodejs_compat"]

# Workers Logs are OFF by default — production was running with no traces or errors
# retained anywhere. head_sampling_rate 1 keeps everything; lower it if volume grows.
[observability]
enabled = true
head_sampling_rate = 1

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

# Hourly housekeeping: expired sessions, tokens, invites and holds, old rate-limit rows
# and 90-day-old logs (src/lib/cleanup.ts), event reminders, and custom-domain checks.
[triggers]
crons = ["0 * * * *"]

# ── Production (hallify.sk + customer custom hostnames) ───────────────────────

[vars]
HALLIFY_DOMAIN = "hallify.sk"
APP_URL = "https://hallify.sk"
EMAIL_FROM = "noreply@hallify.sk"
EMAIL_FROM_NAME = "Hallify"

[[d1_databases]]
binding = "DB"
database_name = "hallify"
database_id = "9d32dc94-c7e4-409b-a86b-13def79ccd88"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "hallify-uploads"

[[routes]]
pattern = "hallify.sk"
custom_domain = true

# Catches ALL custom hostnames entering the zone (Cloudflare for SaaS).
[[routes]]
pattern = "*/*"
zone_name = "hallify.sk"

# ── Dev (dev.hallify.sk, separate worker + database) ──────────────────────────

[env.dev]
name = "hallify-dev"

[env.dev.triggers]
crons = ["0 * * * *"]

[env.dev.vars]
HALLIFY_DOMAIN = "dev.hallify.sk"
APP_URL = "https://dev.hallify.sk"
EMAIL_FROM = "noreply@hallify.sk"
EMAIL_FROM_NAME = "Hallify"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "hallify-dev"
database_id = "52a3ac14-99c3-4485-8daa-c7e602d94def"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "R2"
bucket_name = "hallify-uploads"

# A plain route (not custom_domain): `dev.hallify.sk/*` is MORE SPECIFIC than the
# prod worker's `*/*`, so route-specificity sends dev.hallify.sk to this worker.
# (Routes take priority over Custom Domains, so a custom_domain here loses to `*/*`.)
# Requires a proxied DNS record for dev.hallify.sk (the `*.hallify.sk` wildcard or a
# dedicated `dev` record). SSL is covered by the Universal `*.hallify.sk` cert.
[[env.dev.routes]]
pattern = "dev.hallify.sk/*"
zone_name = "hallify.sk"
